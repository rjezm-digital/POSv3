<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<title>Order Status</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-4">

<div class="max-w-md mx-auto bg-white p-4 rounded shadow">
<h1 class="text-lg font-bold mb-3">📦 Order Status Update</h1>

<input id="orderNo" placeholder="Order No" class="w-full border p-2 mb-2">

<select id="status" class="w-full border p-2 mb-2">
  <option>Pending</option>
  <option>Printing</option>
  <option>Ready</option>
  <option>Released</option>
</select>

<button onclick="updateStatus()" class="w-full bg-blue-600 text-white py-2 rounded">
Update Status
</button>
</div>

<script>
const SHEET_URL = "PASTE_YOUR_WEB_APP_URL";

function updateStatus(){
  fetch(SHEET_URL,{
    method:"POST",
    body:JSON.stringify({
      type:"status",
      orderNo:orderNo.value,
      status:status.value
    })
  });
  alert("Status updated");
}
</script>
</body>
</html>
